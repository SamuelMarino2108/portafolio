  <!-- Apply saved theme and language before first paint to avoid a flash -->
  <script>
    (function () {
      var root = document.documentElement, lang = null;
      try {
        if (localStorage.getItem("theme") === "light") root.dataset.theme = "light";
        lang = localStorage.getItem("lang");
      } catch (e) {}
      // First visit: Spanish only if the browser language starts with "es".
      if (lang !== "es" && lang !== "en") lang = /^es/i.test(navigator.language || "") ? "es" : "en";
      root.lang = lang;
    })();
  </script>
